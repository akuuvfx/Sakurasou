name: Sakurasou
options:
  bundleIdPrefix: com.sakurasou
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  Sakurasou:
    type: application
    platform: iOS
    sources:
      - Sakurasou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sakurasou.app
        INFOPLIST_FILE: Sakurasou/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
