name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # --- Python embarqué (comme Palladium) ---
      - name: Download Python Apple Support
        uses: robinraju/release-downloader@v1
        with:
          repository: beeware/Python-Apple-support
          tag: "3.13-b18"
          fileName: "*iOS-support*.tar.gz"
          out-file-path: python-download
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python.xcframework
        run: |
          set -euo pipefail
          mkdir -p Frameworks tmp-py
          ARCHIVE=$(find python-download -maxdepth 1 -name "*iOS-support*.tar.gz" | head -n 1)
          tar -xzf "$ARCHIVE" -C tmp-py
          XCF=$(find tmp-py -type d -name "Python.xcframework" | head -n 1)
          rm -rf Frameworks/Python.xcframework
          cp -R "$XCF" Frameworks/Python.xcframework
          grep -h 'define PY_VERSION ' Frameworks/Python.xcframework/ios-arm64/Python.framework/Headers/patchlevel.h

      # --- ffmpeg embarqué (SwiftFFmpeg-iOS de tfourj, utilisé par Palladium) ---
      - name: Download SwiftFFmpeg-iOS release
        uses: robinraju/release-downloader@v1
        with:
          repository: tfourj/SwiftFFmpeg-iOS
          latest: true
          fileName: SwiftFFmpeg-iOS.zip
          out-file-path: swiftffmpeg-download
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install SwiftFFmpeg-iOS
        run: |
          set -euo pipefail
          mkdir -p swiftffmpeg-extract
          unzip -q swiftffmpeg-download/SwiftFFmpeg-iOS.zip -d swiftffmpeg-extract
          # Le dossier du paquet est celui qui contient Package.swift ET FFmpeg.xcframework
          PKG=""
          for d in $(find swiftffmpeg-extract -name Package.swift -exec dirname {} \;); do
            if [ -d "$d/FFmpeg.xcframework" ]; then PKG="$d"; break; fi
          done
          if [ -z "$PKG" ]; then
            echo "Arborescence extraite :"; find swiftffmpeg-extract -maxdepth 3
            echo "Package.swift ou FFmpeg.xcframework introuvable"; exit 1
          fi
          rm -rf Frameworks/SwiftFFmpeg-iOS
          cp -R "$PKG" Frameworks/SwiftFFmpeg-iOS
          ls Frameworks/SwiftFFmpeg-iOS

      # --- yt-dlp (pur Python) installé dans un dossier de paquets ---
      - name: Download yt-dlp into app packages
        run: |
          set -euo pipefail
          python3 -m pip install --target Frameworks/yt-dlp-packages --no-compile yt-dlp
          ls Frameworks/yt-dlp-packages

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        env:
          PALLADIUM_DISABLE_PYTHON_DYLIB_CODESIGN: "1"
        run: |
          set -o pipefail
          xcodebuild -project Sakurasou.xcodeproj -scheme Sakurasou \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            2>&1 | tee xcodebuild.log

      - name: Résumé des erreurs de build
        if: failure()
        run: |
          grep -E "error:|BUILD FAILED|failed with a nonzero exit code" xcodebuild.log | sort -u | head -20 \
            | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Sakurasou.app Payload/
          zip -qr Sakurasou.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Sakurasou-ipa
          path: Sakurasou.ipa

      - name: Publish release (SideStore)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sakurasou (latest)
          files: Sakurasou.ipa
          overwrite_files: true
